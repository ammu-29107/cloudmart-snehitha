name: CloudMart Milestone 2 Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'lambda/**'
      - 'scripts/**'
      - 'sql/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------------

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # VALIDATION
      # ------------------------------------------------------------

      - name: Validate CloudFormation templates
        run: |
          for tpl in cloudformation/*.yaml; do
            echo "============================================"
            echo "Validating $tpl"
            echo "============================================"

            aws cloudformation validate-template \
              --template-body "file://$tpl" >/dev/null

            echo "$tpl validated successfully."
          done

      - name: Compile Python sources
        run: |
          python -m compileall lambda

      - name: Validate deployment script
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/validate.sh

      # ------------------------------------------------------------
      # MILESTONE 2 DEPLOYMENT
      # ------------------------------------------------------------

      - name: Deploy Milestone 2 infrastructure
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        run: |
          bash scripts/deploy.sh "$ENVIRONMENT"

      # ------------------------------------------------------------
      # FINAL RESULT
      # ------------------------------------------------------------

      - name: Publish deployment result
        if: always()
        run: |
          echo "============================================"
          echo "CloudMart Milestone 2 deployment status:"
          echo "${{ job.status }}"
          echo "Environment: $ENVIRONMENT"
          echo "Region: $AWS_REGION"
          echo "Commit: $GITHUB_SHA"
          echo "============================================"
