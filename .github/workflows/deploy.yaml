name: Deploy CloudMart Network

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-network-stack
  TEMPLATE_FILE: cloudformation/network-stack.yaml

jobs:

  # ============================================================
  # JOB 1 — VALIDATE NETWORK TEMPLATE
  # ============================================================

  validate-network:
    name: Validate Network CloudFormation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "============================================================"
          echo "AWS IDENTITY"
          echo "============================================================"

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

      - name: Validate CloudFormation template
        run: |
          echo "============================================================"
          echo "VALIDATING NETWORK TEMPLATE"
          echo "============================================================"

          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_FILE}"

          echo ""
          echo "============================================================"
          echo "NETWORK TEMPLATE VALIDATION SUCCESSFUL"
          echo "============================================================"


  # ============================================================
  # JOB 2 — DEPLOY NETWORK STACK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    needs:
      - validate-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ========================================================
      # VERIFY AWS ACCESS
      # ========================================================

      - name: Verify AWS identity
        run: |
          echo "============================================================"
          echo "VERIFYING AWS CONNECTION"
          echo "============================================================"

          aws sts get-caller-identity

          echo ""
          echo "Region:"
          echo "${AWS_REGION}"

      # ========================================================
      # CHECK / CLEAN ROLLBACK_COMPLETE
      # ========================================================

      - name: Check existing CloudFormation stack
        id: stack-check
        run: |
          echo "============================================================"
          echo "CHECKING EXISTING NETWORK STACK"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then

            echo "No existing stack found."
            echo "A new stack will be created."

          else

            echo "Existing stack found:"
            echo "${STACK_NAME}"

            echo ""
            echo "Current status:"
            echo "${STATUS}"

            if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then

              echo ""
              echo "============================================================"
              echo "STACK IS IN ROLLBACK_COMPLETE"
              echo "============================================================"

              echo "Deleting failed stack..."

              aws cloudformation delete-stack \
                --stack-name "${STACK_NAME}"

              echo ""
              echo "Waiting for stack deletion..."

              aws cloudformation wait stack-delete-complete \
                --stack-name "${STACK_NAME}"

              echo ""
              echo "Failed stack deleted successfully."
              echo "CloudFormation can now create a fresh stack."

            elif [ "$STATUS" = "DELETE_IN_PROGRESS" ]; then

              echo "Stack deletion already in progress."
              echo "Waiting for deletion to complete..."

              aws cloudformation wait stack-delete-complete \
                --stack-name "${STACK_NAME}"

            elif [ "$STATUS" = "CREATE_FAILED" ]; then

              echo ""
              echo "Stack is in CREATE_FAILED."
              echo "Deleting failed stack..."

              aws cloudformation delete-stack \
                --stack-name "${STACK_NAME}"

              aws cloudformation wait stack-delete-complete \
                --stack-name "${STACK_NAME}"

              echo "Failed stack deleted."

            elif [ "$STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then

              echo ""
              echo "Stack is in UPDATE_ROLLBACK_COMPLETE."
              echo "It can normally be updated."

            elif [ "$STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then

              echo ""
              echo "ERROR:"
              echo "Stack is in UPDATE_ROLLBACK_FAILED."
              echo ""
              echo "Manual CloudFormation recovery is required."
              exit 1

            elif [ "$STATUS" = "DELETE_COMPLETE" ]; then

              echo "Stack is already deleted."

            else

              echo ""
              echo "Stack is in status:"
              echo "${STATUS}"

              echo ""
              echo "Proceeding with CloudFormation deployment."

            fi

          fi

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy network stack
        run: |
          echo "============================================================"
          echo "STARTING NETWORK CLOUDFORMATION DEPLOYMENT"
          echo "============================================================"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Template:"
          echo "  ${TEMPLATE_FILE}"

          echo ""
          echo "============================================================"
          echo "NETWORK RESOURCES"
          echo "============================================================"

          echo "  - VPC"
          echo "  - Internet Gateway"
          echo "  - Public Subnet"
          echo "  - Private Subnet A"
          echo "  - Private Subnet B"
          echo "  - Public Route Table"
          echo "  - Private Route Table"
          echo "  - Lambda Security Group"
          echo "  - RDS Security Group"
          echo "  - VPC Endpoint Security Group"
          echo "  - S3 Gateway Endpoint"
          echo "  - SSM Interface Endpoint"
          echo "  - EventBridge Interface Endpoint"
          echo "  - SNS Interface Endpoint"

          echo ""
          echo "No RDS instance is created by this stack."
          echo "No Lambda function is created by this stack."
          echo "No NAT Gateway is created by this stack."

          echo ""
          echo "============================================================"
          echo "RUNNING CLOUDFORMATION DEPLOY"
          echo "============================================================"

          aws cloudformation deploy \
            --template-file "${TEMPLATE_FILE}" \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset

      # ========================================================
      # STACK STATUS
      # ========================================================

      - name: Print stack status
        if: always()
        run: |
          echo "============================================================"
          echo "CLOUDFORMATION STACK STATUS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].{StackName:StackName,Status:StackStatus}' \
            --output table || true

      # ========================================================
      # STACK OUTPUTS
      # ========================================================

      - name: Print network stack outputs
        if: success()
        run: |
          echo "============================================================"
          echo "NETWORK STACK OUTPUTS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[*].{Export:ExportName,Key:OutputKey,Value:OutputValue}' \
            --output table

      # ========================================================
      # EXPORT VERIFICATION
      # ========================================================

      - name: Verify CloudFormation exports
        if: success()
        run: |
          echo "============================================================"
          echo "VERIFYING CLOUDFORMATION EXPORTS"
          echo "============================================================"

          aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?starts_with(Name, 'cloudmart-${ENVIRONMENT}-')].[Name,Value]" \
            --output table

      # ========================================================
      # FAILED EVENTS
      # ========================================================

      - name: Show CloudFormation failure events
        if: failure()
        run: |
          echo "============================================================"
          echo "NETWORK DEPLOYMENT FAILED"
          echo "============================================================"

          echo ""
          echo "Failed CloudFormation events:"
          echo ""

          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table || true

          echo ""
          echo "Recent CloudFormation events:"
          echo ""

          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --max-items 20 \
            --output table || true

      # ========================================================
      # SUCCESS
      # ========================================================

      - name: Network deployment successful
        if: success()
        run: |
          echo ""
          echo "################################################################"
          echo "#              NETWORK DEPLOYMENT SUCCESSFUL                 #"
          echo "################################################################"

          echo ""
          echo "CloudMart network stack deployed successfully."

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "CloudFormation exports are available for"
          echo "subsequent CloudMart infrastructure stacks."

          echo ""
          echo "################################################################"
