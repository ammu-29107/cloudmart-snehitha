              *) sleep 30 ;;
            esac
          done

  # ═══════════════════════════════════════════════════════
  # JOB 5: Summary
  # ═══════════════════════════════════════════════════════
  summary:
    name: Show All Exports
    runs-on: ubuntu-latest
    needs: deploy-eventbus
    if: always()
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: List all cloudmart-dev exports
        run: |
          aws cloudformation list-exports \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].{Name:Name,Value:Value}" \
            --output table