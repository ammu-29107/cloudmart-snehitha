                ;;

            esac

          done


  # ============================================================
  # JOB 5
  # PRODUCT STACK
  # ============================================================

  deploy-product:

    name: Deploy product-stack

    runs-on: ubuntu-latest

    needs:
      - deploy-eventbus

    env:

      STACK_NAME: cloudmart-dev-product

      TEMPLATE_FILE: cloudformation/product-stack.yaml

      CHANGESET_NAME: cs-product-${{ github.run_id }}-${{ github.run_attempt }}


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - uses: actions/checkout@v4


      # ========================================================
      # SETUP PYTHON
      # ========================================================

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ========================================================
      # AWS CREDENTIALS
      # ========================================================

      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ secrets.AWS_REGION }}


      # ========================================================
      # AUTH TOKEN
      # ========================================================

      - name: Write auth token SecureString

        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --type SecureString \
            --value "${{ secrets.CLOUDMART_API_TOKEN }}" \
            --overwrite


      # ========================================================
      # LOW STOCK THRESHOLD
      # ========================================================

      - name: Write low-stock threshold parameter

        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/inventory/low-stock-threshold" \
            --type String \
            --value "10" \
            --overwrite


      # ========================================================
      # GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda artifacts bucket name

        id: bucket

        run: |

          BUCKET=$(aws cloudformation list-exports \
            --query "Exports[?Name=='cloudmart-dev-lambda-artifacts-bucket'].Value" \
            --output text)


          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifacts bucket export not found."

            exit 1

          fi


          echo "Lambda artifact bucket: $BUCKET"


          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================================
      # PREPARE BUILD DIRECTORIES
      # ========================================================

      - name: Prepare Lambda build directories

        run: |

          rm -rf build

          mkdir -p build/product
          mkdir -p build/authorizer
          mkdir -p build/schema-apply


      # ========================================================
      # PACKAGE PRODUCT
      # ========================================================

      - name: Package Product Lambda

        run: |

          test -f src/product/handler.py || {
            echo "ERROR: src/product/handler.py not found."
            exit 1
          }


          test -f src/shared/auth.py || {
            echo "ERROR: src/shared/auth.py not found."
            exit 1
          }


          cp src/product/handler.py \
            build/product/handler.py


          mkdir -p build/product/shared


          cp src/shared/auth.py \
            build/product/shared/auth.py


          pip install pymysql \
            -t build/product \
            --break-system-packages


          cd build/product


          zip -r ../../product.zip .


          cd ../..


          aws s3 cp \
            product.zip \
            "s3://${{ steps.bucket.outputs.name }}/dev/product/product-${{ github.sha }}.zip"


      # ========================================================
      # PACKAGE AUTHORIZE LAMBDA
      # ========================================================

      - name: Package Authorizer Lambda

        run: |

          test -f src/authorizer/lambda_function.py || {
            echo "ERROR: src/authorizer/lambda_function.py not found."
            exit 1
          }


          cp src/authorizer/lambda_function.py \
            build/authorizer/lambda_function.py


          cd build/authorizer


          zip -r ../../authorizer.zip .


          cd ../..


          aws s3 cp \
            authorizer.zip \
            "s3://${{ steps.bucket.outputs.name }}/dev/authorizer/authorizer-${{ github.sha }}.zip"


      # ========================================================
      # PACKAGE SCHEMA APPLY
      # ========================================================

      - name: Package schema-apply Lambda

        run: |

          test -f src/schema-apply/handler.py || {
            echo "ERROR: src/schema-apply/handler.py not found."
            exit 1
          }


          cp src/schema-apply/handler.py \
            build/schema-apply/handler.py


          pip install pymysql \
            -t build/schema-apply \
            --break-system-packages


          cd build/schema-apply


          zip -r ../../schema-apply.zip .


          cd ../..


          aws s3 cp \
            schema-apply.zip \
            "s3://${{ steps.bucket.outputs.name }}/dev/schema-apply/schema-apply-${{ github.sha }}.zip"


      # ========================================================
      # CHECK EXISTING PRODUCT STACK
      # ========================================================

      - name: Determine change set type

        id: stack-check

        run: |

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")


          echo "Current product stack status: $STACK_STATUS"


          case "$STACK_STATUS" in

            NOT_FOUND|REVIEW_IN_PROGRESS)

              echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"

              ;;


            ROLLBACK_COMPLETE|ROLLBACK_FAILED)

              echo "Deleting failed product stack..."


              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME"


              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME"


              echo "Stack deleted."


              echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"

              ;;


            UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_FAILED|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS)

              echo "ERROR: Product stack is currently in an unstable CloudFormation state."

              echo "Current state: $STACK_STATUS"

              echo

              echo "Resolve the stack state before running this deployment again."

              exit 1

              ;;


            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|IMPORT_IN_PROGRESS|IMPORT_ROLLBACK_IN_PROGRESS)

              echo "ERROR: Product stack is already being modified."

              echo "Current state: $STACK_STATUS"

              exit 1

              ;;


            *)

              echo "changeset_type=UPDATE" >> "$GITHUB_OUTPUT"

              ;;

          esac


      # ========================================================
      # CREATE CHANGE SET
      # ========================================================

      - name: Create product change set

        run: |

          test -s "$TEMPLATE_FILE" || {
            echo "ERROR: $TEMPLATE_FILE is empty."
            exit 1
          }


          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --change-set-type "${{ steps.stack-check.outputs.changeset_type }}" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              ParameterKey=Environment,ParameterValue=dev \
              ParameterKey=LambdaCodeKey,ParameterValue=dev/product/product-${{ github.sha }}.zip \
              ParameterKey=AuthorizerCodeKey,ParameterValue=dev/authorizer/authorizer-${{ github.sha }}.zip \
              ParameterKey=SchemaApplyCodeKey,ParameterValue=dev/schema-apply/schema-apply-${{ github.sha }}.zip \
              ParameterKey=AlertEmail,ParameterValue=${{ secrets.ALERT_EMAIL }} \
            --capabilities CAPABILITY_NAMED_IAM


      # ========================================================
      # WAIT FOR CHANGE SET
      # ========================================================

      - name: Wait for change set

        run: |

          for i in $(seq 1 20); do

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'Status' \
              --output text)


            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'StatusReason' \
              --output text)


            echo "Attempt $i/20 - Status: $STATUS"


            if [ "$STATUS" = "CREATE_COMPLETE" ]; then

              echo "ready=true" >> "$GITHUB_ENV"

              break


                        elif [ "$STATUS" = "FAILED" ]; then

              echo "Change set failed."

              echo "Reason: $REASON"

              echo
              echo "======================================================"
              echo "FULL CHANGE SET DETAILS"
              echo "======================================================"

              aws cloudformation describe-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME" \
                --output json || true

              echo
              echo "======================================================"
              echo "CLOUDFORMATION DESCRIBE EVENTS"
              echo "======================================================"

              aws cloudformation describe-events \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME" \
                --region "${{ secrets.AWS_REGION }}" \
                --output json || true

              echo
              echo "======================================================"
              echo "RECENT STACK EVENTS"
              echo "======================================================"

              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query 'StackEvents[:20].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                --output table || true

              echo

              if echo "$REASON" |
                grep -qi "didn't contain changes\|No updates"; then

                echo "No changes to deploy."

                echo "ready=nochange" >> "$GITHUB_ENV"

                break

              else

                exit 1

              fi

            else

              sleep 15

            fi

          done


      # ========================================================
      # EXECUTE
      # ========================================================

      - name: Execute change set

        if: env.ready == 'true'

        run: |

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME"


      # ========================================================
      # WAIT FOR PRODUCT STACK
      # ========================================================

      - name: Wait for product stack

        if: env.ready == 'true'

        run: |

          for i in $(seq 1 40); do

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)


            echo "Attempt $i/40 - Stack status: $STATUS"


            case "$STATUS" in

              CREATE_COMPLETE|UPDATE_COMPLETE)

                echo "Product stack healthy."

                exit 0

                ;;


              *IN_PROGRESS)

                sleep 30

                ;;


              *FAILED|*ROLLBACK_COMPLETE)

                echo "Product stack failed: $STATUS"


                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --query 'StackEvents[:20].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                  --output table


                exit 1

                ;;


              *)

                sleep 30

                ;;

            esac

          done


          echo "ERROR: Product stack did not reach a stable state within the expected time."

          exit 1


      # ========================================================
      # APPLY RDS SCHEMA
      # ========================================================

      - name: Apply RDS schema + sample data

        run: |

          echo "Invoking Schema Apply Lambda..."


          aws lambda invoke \
            --function-name cloudmart-dev-schema-apply \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json


          echo "Raw Schema Apply response:"


          cat schema-response.json


          echo


          python3 <<'PY'

          import json
          import sys


          with open("schema-response.json") as f:
              response = json.load(f)


          print("Lambda response:")

          print(json.dumps(response, indent=2))


          if response.get("FunctionError"):

              print(
                  "ERROR: Schema Apply Lambda failed with FunctionError:"
              )

              print(response["FunctionError"])

              sys.exit(1)


          if "body" not in response:

              print(
                  "ERROR: Schema Apply Lambda response does not "
                  "contain a 'body' field."
              )

              sys.exit(1)


          body = response["body"]


          if isinstance(body, str):

              try:

                  payload = json.loads(body)

              except json.JSONDecodeError:

                  print("ERROR: Lambda body is not valid JSON.")

                  print(body)

                  sys.exit(1)

          else:

              payload = body


          print("Schema Apply payload:")

          print(json.dumps(payload, indent=2))


          status_code = response.get("statusCode")


          if status_code != 200:

              print(
                  f"ERROR: Schema Apply returned statusCode "
                  f"{status_code}"
              )

              sys.exit(1)


          if payload.get("success") is not True:

              print("ERROR: Schema Apply reported failure.")

              sys.exit(1)


          print(
              f"Schema applied successfully: "
              f"{payload.get('tables_applied')} tables."
          )

          PY


      # ========================================================
      # READ PRODUCT URL
      # ========================================================

      - name: Read Product Function URL

        id: outputs

        run: |

          PRODUCT_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductFunctionUrl'].OutputValue" \
            --output text)


          if [ -z "$PRODUCT_URL" ] || [ "$PRODUCT_URL" = "None" ]; then

            echo "ERROR: Product Function URL was not returned."

            exit 1

          fi


          echo "Product URL: $PRODUCT_URL"


          echo "product_url=$PRODUCT_URL" >> "$GITHUB_OUTPUT"


      # ========================================================
      # READ AUTHORIZER URL
      # ========================================================

      - name: Read Authorizer Function URL

        id: authorizer

        run: |

          AUTHORIZER_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerFunctionUrl'].OutputValue" \
            --output text)


          if [ -z "$AUTHORIZER_URL" ] || [ "$AUTHORIZER_URL" = "None" ]; then

            echo "ERROR: Authorizer Function URL was not returned."

            exit 1

          fi


          echo "Authorizer URL: $AUTHORIZER_URL"


          echo "authorizer_url=$AUTHORIZER_URL" >> "$GITHUB_OUTPUT"


      # ========================================================
      # AUTHORIZE TEST
      # ========================================================

      - name: Smoke test - Authorizer rejects missing token

        run: |

          URL="${{ steps.authorizer.outputs.authorizer_url }}"


          echo "Testing Authorizer Function URL..."

          echo "$URL"

          echo


          SUCCESS=false


          for attempt in {1..10}; do

            echo "Attempt $attempt/10"


            STATUS=$(curl \
              -s \
              -o /tmp/authorizer-response.txt \
              -w "%{http_code}" \
              --max-time 15 \
              "$URL")


            echo "Authorizer HTTP status: $STATUS"


            if [ "$STATUS" -eq 401 ]; then

              echo "Authorizer correctly rejected missing token."


              echo "Response:"

              cat /tmp/authorizer-response.txt || true


              SUCCESS=true

              break


            elif [ "$STATUS" -eq 403 ]; then

              echo "Received HTTP 403."


              echo "Response:"

              cat /tmp/authorizer-response.txt || true


              echo

              echo "The Function URL may still be propagating."

              echo "Waiting before retry..."


              sleep 10


            else

              echo "Unexpected Authorizer response: $STATUS"


              echo "Response:"

              cat /tmp/authorizer-response.txt || true


              exit 1

            fi

          done


          if [ "$SUCCESS" != "true" ]; then

            echo

            echo "======================================================"

            echo "ERROR: Authorizer Function URL remained at HTTP 403."

            echo "======================================================"

            echo


            echo "Checking Lambda Function URL configuration..."

            aws lambda get-function-url-config \
              --function-name cloudmart-dev-authorizer \
              --output json || true


            echo

            echo "Checking Authorizer Lambda resource policy..."

            aws lambda get-policy \
              --function-name cloudmart-dev-authorizer \
              --output json || true


            echo

            echo "Checking Authorizer Lambda configuration..."

            aws lambda get-function-configuration \
              --function-name cloudmart-dev-authorizer \
              --query '{FunctionName:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,Runtime:Runtime,Handler:Handler}' \
              --output table || true


            echo

            echo "Recent Authorizer Lambda logs:"

            aws logs describe-log-streams \
              --log-group-name /aws/lambda/cloudmart-dev-authorizer \
              --order-by LastEventTime \
              --descending \
              --max-items 3 \
              --output table || true


            echo

            echo "Authorizer Function URL did not become reachable."

            exit 1

          fi


            # ========================================================
      # PRODUCT TEST - NO TOKEN
      # ========================================================

      - name: Smoke test - Product without token returns 401

        run: |

          URL="${{ steps.outputs.outputs.product_url }}products"

          echo "Testing Product without application token..."

          echo "$URL"

          echo


          SUCCESS=false


          for attempt in {1..10}; do

            echo "Attempt $attempt/10"


            STATUS=$(curl \
              -s \
              -o /tmp/product-no-token-response.txt \
              -w "%{http_code}" \
              --max-time 15 \
              --aws-sigv4 "aws:amz:${{ secrets.AWS_REGION }}:lambda" \
              --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
              -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
              "$URL")


            echo "Product HTTP status: $STATUS"


            if [ "$STATUS" -eq 401 ]; then

              echo "Product correctly rejected missing application token."


              echo "Response:"

              cat /tmp/product-no-token-response.txt || true


              SUCCESS=true

              break


            elif [ "$STATUS" -eq 403 ]; then

              echo "Received HTTP 403."

              echo "Checking IAM Function URL access..."

              cat /tmp/product-no-token-response.txt || true

              sleep 10


            else

              echo "Unexpected Product response: $STATUS"

              cat /tmp/product-no-token-response.txt || true

              exit 1

            fi

          done


          if [ "$SUCCESS" != "true" ]; then

            echo

            echo "ERROR: Product did not return 401 for missing application token."

            exit 1

          fi


      # ========================================================
      # PRODUCT TEST - WRONG TOKEN
      # ========================================================

      - name: Smoke test - Product wrong token returns 401

        run: |

          URL="${{ steps.outputs.outputs.product_url }}products"


          echo "Testing Product with wrong application token..."

          echo "$URL"

          echo


          SUCCESS=false


          for attempt in {1..10}; do

            echo "Attempt $attempt/10"


            STATUS=$(curl \
              -s \
              -o /tmp/product-wrong-token-response.txt \
              -w "%{http_code}" \
              --max-time 15 \
              --aws-sigv4 "aws:amz:${{ secrets.AWS_REGION }}:lambda" \
              --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
              -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
              -H "Authorization: Bearer wrong-token" \
              "$URL")


            echo "Product HTTP status: $STATUS"


            if [ "$STATUS" -eq 401 ]; then

              echo "Product correctly rejected wrong application token."


              echo "Response:"

              cat /tmp/product-wrong-token-response.txt || true


              SUCCESS=true

              break


            elif [ "$STATUS" -eq 403 ]; then

              echo "Received HTTP 403."

              echo "Checking IAM Function URL access..."

              cat /tmp/product-wrong-token-response.txt || true

              sleep 10


            else

              echo "Unexpected Product response: $STATUS"

              cat /tmp/product-wrong-token-response.txt || true

              exit 1

            fi

          done


          if [ "$SUCCESS" != "true" ]; then

            echo

            echo "ERROR: Product did not return 401 for wrong application token."

            exit 1

          fi


      # ========================================================
      # PRODUCT TEST - CORRECT TOKEN
      # ========================================================

      - name: Smoke test - Product correct token returns 200

        run: |

          URL="${{ steps.outputs.outputs.product_url }}products"


          echo "Testing Product with correct application token..."

          echo "$URL"

          echo


          SUCCESS=false


          for attempt in {1..10}; do

            echo "Attempt $attempt/10"


            STATUS=$(curl \
              -s \
              -o /tmp/product-correct-token-response.txt \
              -w "%{http_code}" \
              --max-time 15 \
              --aws-sigv4 "aws:amz:${{ secrets.AWS_REGION }}:lambda" \
              --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
              -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
              -H "Authorization: Bearer ${{ secrets.CLOUDMART_API_TOKEN }}" \
              "$URL")


            echo "Product HTTP status: $STATUS"


            if [ "$STATUS" -eq 200 ]; then

              echo "Product Function URL is healthy."


              echo "Response:"

              cat /tmp/product-correct-token-response.txt || true


              SUCCESS=true

              break


            elif [ "$STATUS" -eq 403 ]; then

              echo "Received HTTP 403."

              echo "Checking IAM Function URL access..."

              cat /tmp/product-correct-token-response.txt || true

              sleep 10


            else

              echo "Unexpected Product response: $STATUS"

              cat /tmp/product-correct-token-response.txt || true

              exit 1

            fi

          done


          if [ "$SUCCESS" != "true" ]; then

            echo

            echo "ERROR: Product Function URL did not return 200."

            exit 1

          fi


  # ============================================================
  # JOB 6
  # SUMMARY
  # ============================================================

  summary:

    name: Show All Exports

    runs-on: ubuntu-latest

    needs:
      - deploy-product

    if: always()


    steps:

      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ secrets.AWS_REGION }}


      - name: List all cloudmart-dev exports

        run: |

          aws cloudformation list-exports \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].{Name:Name,Value:Value}" \
            --output table