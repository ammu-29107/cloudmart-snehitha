name: CloudMart - Milestone 2 Network Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  NETWORK_STACK_NAME: cloudmart-dev-network

jobs:

  # ============================================================
  # JOB 1 — CHECK AWS ACCESS
  # ============================================================

  aws-access-check:
    name: "1. AWS Access Check"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print deployment environment
        run: |
          echo "============================================================"
          echo "              CLOUDMART AWS ACCESS CHECK"
          echo "============================================================"
          echo "AWS Region      : $AWS_REGION"
          echo "Environment     : $ENVIRONMENT"
          echo "Stack           : $NETWORK_STACK_NAME"
          echo "============================================================"

      - name: Verify AWS identity
        run: |
          echo ""
          echo "Checking AWS identity..."
          echo ""

          aws sts get-caller-identity

          echo ""
          echo "AWS identity check completed."
          echo ""


      # --------------------------------------------------------
      # EC2 READ PERMISSION CHECK
      # --------------------------------------------------------

      - name: Check EC2 read permissions
        run: |
          echo "============================================================"
          echo "             CHECKING EC2 READ PERMISSIONS"
          echo "============================================================"
          echo ""
          echo "These permissions are used only for deployment diagnostics."
          echo ""

          echo "[1/4] ec2:DescribeVpcs"
          aws ec2 describe-vpcs \
            --max-results 5 \
            --region "$AWS_REGION" \
            > /tmp/vpcs.json

          echo "      PASS"

          echo ""
          echo "[2/4] ec2:DescribeSubnets"
          aws ec2 describe-subnets \
            --max-results 5 \
            --region "$AWS_REGION" \
            > /tmp/subnets.json

          echo "      PASS"

          echo ""
          echo "[3/4] ec2:DescribeRouteTables"
          aws ec2 describe-route-tables \
            --max-results 5 \
            --region "$AWS_REGION" \
            > /tmp/routes.json

          echo "      PASS"

          echo ""
          echo "[4/4] ec2:DescribeSecurityGroups"
          aws ec2 describe-security-groups \
            --max-results 5 \
            --region "$AWS_REGION" \
            > /tmp/security-groups.json

          echo "      PASS"

          echo ""
          echo "============================================================"
          echo "             EC2 READ PERMISSIONS: PASSED"
          echo "============================================================"


  # ============================================================
  # JOB 2 — VALIDATE NETWORK TEMPLATE
  # ============================================================

  validate-network:
    name: "2. Validate Network Template"
    runs-on: ubuntu-latest
    needs: aws-access-check

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          echo "============================================================"
          echo "       VALIDATING NETWORK CLOUDFORMATION TEMPLATE"
          echo "============================================================"
          echo ""
          echo "Template:"
          echo "cloudformation/network-stack.yaml"
          echo ""
          echo "Region:"
          echo "$AWS_REGION"
          echo ""

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

          echo ""
          echo "============================================================"
          echo "       NETWORK TEMPLATE VALIDATION: PASSED"
          echo "============================================================"


  # ============================================================
  # JOB 3 — DEPLOY NETWORK STACK
  # ============================================================

  deploy-network:
    name: "3. Deploy Network Stack"
    runs-on: ubuntu-latest
    needs: validate-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print deployment information
        run: |
          echo ""
          echo "################################################################"
          echo "#                CLOUDMART NETWORK DEPLOYMENT                #"
          echo "################################################################"
          echo ""
          echo "AWS Region       : $AWS_REGION"
          echo "Environment      : $ENVIRONMENT"
          echo "Stack Name       : $NETWORK_STACK_NAME"
          echo "Template         : cloudformation/network-stack.yaml"
          echo ""
          echo "Architecture:"
          echo "  VPC"
          echo "   ├── Public Subnet"
          echo "   ├── Private Subnet A"
          echo "   └── Private Subnet B"
          echo ""
          echo "Private Subnet B:"
          echo "  Exists for the mandatory RDS DB subnet group"
          echo "  second-AZ requirement."
          echo "  It does NOT represent a second application deployment."
          echo ""
          echo "Deployment Region: ap-south-1"
          echo ""
          echo "################################################################"
          echo ""

      # --------------------------------------------------------
      # DEPLOY
      # --------------------------------------------------------

      - name: Deploy CloudFormation network stack
        run: |
          echo "============================================================"
          echo "STARTING CLOUDFORMATION DEPLOYMENT"
          echo "============================================================"
          echo ""

          echo "Creating/updating stack:"
          echo "$NETWORK_STACK_NAME"
          echo ""

          aws cloudformation deploy \
            --stack-name "$NETWORK_STACK_NAME" \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

          echo ""
          echo "CloudFormation deployment command completed."
          echo ""


      # --------------------------------------------------------
      # SHOW STACK STATUS
      # --------------------------------------------------------

      - name: Show network stack status
        run: |
          echo "============================================================"
          echo "                 NETWORK STACK STATUS"
          echo "============================================================"
          echo ""

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus,StackStatusReason]' \
            --output table

          echo ""


      # --------------------------------------------------------
      # SHOW STACK OUTPUTS
      # --------------------------------------------------------

      - name: Show network stack outputs
        run: |
          echo "============================================================"
          echo "                 NETWORK STACK OUTPUTS"
          echo "============================================================"
          echo ""

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue,Description]' \
            --output table

          echo ""


      # --------------------------------------------------------
      # VERIFY VPC
      # --------------------------------------------------------

      - name: Verify VPC
        run: |
          echo "============================================================"
          echo "                    VERIFYING VPC"
          echo "============================================================"
          echo ""

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
            --output text)

          echo "VPC ID: $VPC_ID"
          echo ""

          aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --region "$AWS_REGION" \
            --query 'Vpcs[0].[VpcId,CidrBlock,State,IsDefault]' \
            --output table

          echo ""


      # --------------------------------------------------------
      # VERIFY SUBNETS
      # --------------------------------------------------------

      - name: Verify subnets
        run: |
          echo "============================================================"
          echo "                 VERIFYING SUBNETS"
          echo "============================================================"
          echo ""

          echo "Private Subnet A:"
          PRIVATE_A=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          aws ec2 describe-subnets \
            --subnet-ids "$PRIVATE_A" \
            --region "$AWS_REGION" \
            --query 'Subnets[0].[SubnetId,CidrBlock,AvailabilityZone,State]' \
            --output table

          echo ""
          echo "Private Subnet B:"
          PRIVATE_B=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          aws ec2 describe-subnets \
            --subnet-ids "$PRIVATE_B" \
            --region "$AWS_REGION" \
            --query 'Subnets[0].[SubnetId,CidrBlock,AvailabilityZone,State]' \
            --output table

          echo ""


      # --------------------------------------------------------
      # FINAL RESULT
      # --------------------------------------------------------

      - name: Network deployment successful
        run: |
          echo ""
          echo "################################################################"
          echo "#                NETWORK DEPLOYMENT SUCCESS                  #"
          echo "################################################################"
          echo ""
          echo "CloudMart network foundation is deployed successfully."
          echo ""
          echo "Region:"
          echo "  ap-south-1"
          echo ""
          echo "Stack:"
          echo "  $NETWORK_STACK_NAME"
          echo ""
          echo "Verified:"
          echo "  ✓ VPC"
          echo "  ✓ Public subnet"
          echo "  ✓ Private subnet A"
          echo "  ✓ Private subnet B"
          echo "  ✓ Route tables"
          echo "  ✓ Internet Gateway"
          echo "  ✓ Security groups"
          echo "  ✓ VPC endpoints"
          echo ""
          echo "Private subnet B exists only to satisfy the"
          echo "RDS DB subnet group two-AZ requirement."
          echo ""
          echo "No application/business logic has been deployed."
          echo ""
          echo "################################################################"
