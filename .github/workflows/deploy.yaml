                echo "Stack healthy."
                exit 0
                ;;

              *IN_PROGRESS)
                sleep 30
                ;;

              *FAILED|*ROLLBACK_COMPLETE)
                echo "Stack failed with status: $STATUS"

                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --query 'StackEvents[:15].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                  --output table

                exit 1
                ;;

              *)
                sleep 30
                ;;

            esac

          done


  # ============================================================
  # JOB 4: eventbus-stack
  # ============================================================

  deploy-eventbus:
    name: Deploy eventbus-stack
    runs-on: ubuntu-latest
    needs: deploy-storage

    env:
      STACK_NAME: cloudmart-dev-eventbus
      TEMPLATE_FILE: cloudformation/eventbus-stack.yaml
      CHANGESET_NAME: cs-eventbus-${{ github.run_id }}-${{ github.run_attempt }}

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine change set type
        id: stack-check
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

