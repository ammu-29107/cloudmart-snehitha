name: CloudMart Network Stack Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  STACK_NAME: cloudmart-network-stack
  ENVIRONMENT: dev
  NETWORK_TEMPLATE: cloudformation/network-stack.yaml

jobs:

  # ============================================================
  # JOB 1 — CHECK AWS ACCESS
  # ============================================================
  aws-access-check:
    name: 1. Verify AWS Access
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "============================================================"
          echo "AWS ACCESS CHECK"
          echo "============================================================"

          echo "Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "GitHub Actions is authenticated as:"
          aws sts get-caller-identity

          echo ""
          echo "AWS access successfully verified."
          echo "============================================================"


  # ============================================================
  # JOB 2 — VALIDATE NETWORK TEMPLATE
  # ============================================================
  validate-network-template:
    name: 2. Validate Network Template
    needs: aws-access-check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          echo "============================================================"
          echo "CLOUDFORMATION TEMPLATE VALIDATION"
          echo "============================================================"

          echo "Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "Stack:"
          echo "${STACK_NAME}"

          echo ""
          echo "Template:"
          echo "${NETWORK_TEMPLATE}"

          echo ""
          echo "Validating template..."

          aws cloudformation validate-template \
            --template-body file://${NETWORK_TEMPLATE}

          echo ""
          echo "============================================================"
          echo "NETWORK TEMPLATE VALIDATION SUCCESSFUL"
          echo "============================================================"


  # ============================================================
  # JOB 3 — DEPLOY NETWORK STACK
  # ============================================================
  deploy-network:
    name: 3. Deploy Network Stack
    needs: validate-network-template
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Display deployment information
      # --------------------------------------------------------
      - name: Display deployment configuration
        run: |
          echo "################################################################"
          echo "#              STARTING NETWORK DEPLOYMENT                   #"
          echo "################################################################"

          echo ""
          echo "AWS Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "CloudFormation Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Template:"
          echo "  ${NETWORK_TEMPLATE}"

          echo ""
          echo "Resources expected:"
          echo "  - VPC"
          echo "  - Internet Gateway"
          echo "  - Public Subnet"
          echo "  - Private Subnet A"
          echo "  - Private Subnet B"
          echo "  - Public Route Table"
          echo "  - Private Route Table"
          echo "  - Lambda Security Group"
          echo "  - RDS Security Group"
          echo "  - EC2 Security Group"
          echo "  - VPC Endpoint Security Group"
          echo "  - S3 Gateway Endpoint"
          echo "  - SSM Interface Endpoint"
          echo "  - EventBridge Interface Endpoint"
          echo "  - SNS Interface Endpoint"
          echo "  - SQS Interface Endpoint"

          echo ""
          echo "################################################################"


      # --------------------------------------------------------
      # Check whether a previous failed stack exists
      # --------------------------------------------------------
      - name: Check existing CloudFormation stack
        id: stack-check
        run: |
          echo "============================================================"
          echo "CHECKING EXISTING CLOUDFORMATION STACK"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo ""
          echo "Current stack status:"
          echo "  ${STATUS}"

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Delete ROLLBACK_COMPLETE stack
      #
      # A stack in ROLLBACK_COMPLETE cannot be updated.
      # It must be deleted before recreating it.
      # --------------------------------------------------------
      - name: Remove failed stack if required
        if: steps.stack-check.outputs.status == 'ROLLBACK_COMPLETE'
        run: |
          echo "============================================================"
          echo "PREVIOUS DEPLOYMENT FAILED"
          echo "============================================================"

          echo ""
          echo "Stack is in ROLLBACK_COMPLETE."
          echo "CloudFormation cannot update a stack in this state."

          echo ""
          echo "Deleting previous failed stack:"
          echo "  ${STACK_NAME}"

          aws cloudformation delete-stack \
            --stack-name "${STACK_NAME}"

          echo ""
          echo "Waiting for failed stack to be deleted..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "${STACK_NAME}"

          echo ""
          echo "Previous failed stack successfully removed."

      # --------------------------------------------------------
      # Deploy CloudFormation network stack
      # --------------------------------------------------------
      - name: Deploy network CloudFormation stack
        run: |
          echo "============================================================"
          echo "DEPLOYING NETWORK CLOUDFORMATION STACK"
          echo "============================================================"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Starting CloudFormation deployment..."

          aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file "${NETWORK_TEMPLATE}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo ""
          echo "CloudFormation deployment command completed."

      # --------------------------------------------------------
      # Display stack status
      # --------------------------------------------------------
      - name: Show stack status
        run: |
          echo "============================================================"
          echo "CLOUDFORMATION STACK STATUS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].[StackName,StackStatus,CreationTime,LastUpdatedTime]" \
            --output table

      # --------------------------------------------------------
      # Display CloudFormation resources
      # --------------------------------------------------------
      - name: Show deployed resources
        run: |
          echo "============================================================"
          echo "DEPLOYED NETWORK RESOURCES"
          echo "============================================================"

          aws cloudformation list-stack-resources \
            --stack-name "${STACK_NAME}" \
            --query "StackResourceSummaries[*].[LogicalResourceId,ResourceType,ResourceStatus]" \
            --output table

      # --------------------------------------------------------
      # Display CloudFormation exports
      # --------------------------------------------------------
      - name: Show network stack exports
        run: |
          echo "============================================================"
          echo "NETWORK STACK EXPORTS"
          echo "============================================================"

          echo ""
          echo "These exported values will be consumed by"
          echo "the remaining CloudMart CloudFormation stacks."
          echo ""

          aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].[Name,Value]" \
            --output table

      # --------------------------------------------------------
      # Display important stack outputs
      # --------------------------------------------------------
      - name: Show network stack outputs
        run: |
          echo "============================================================"
          echo "NETWORK STACK OUTPUTS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue,Description]" \
            --output table

      # --------------------------------------------------------
      # Final success message
      # --------------------------------------------------------
      - name: Network deployment success
        run: |
          echo ""
          echo "################################################################"
          echo "#              NETWORK DEPLOYMENT SUCCESSFUL                  #"
          echo "################################################################"

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "The network foundation is now deployed."

          echo ""
          echo "CloudFormation exports are available for"
          echo "the database, storage, messaging and application stacks."

          echo ""
          echo "################################################################"


  # ============================================================
  # JOB 4 — VERIFY NETWORK STACK
  # ============================================================
  verify-network:
    name: 4. Verify Network Stack
    needs: deploy-network
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify final stack state
        run: |
          echo "============================================================"
          echo "FINAL NETWORK STACK VERIFICATION"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Final status:"
          echo "  ${STATUS}"

          if [ "$STATUS" != "CREATE_COMPLETE" ] && \
             [ "$STATUS" != "UPDATE_COMPLETE" ]; then

            echo ""
            echo "NETWORK STACK VERIFICATION FAILED"
            exit 1
          fi

          echo ""
          echo "Network stack verification successful."

          echo ""
          echo "Available exports:"
          aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].[Name,Value]" \
            --output table

          echo ""
          echo "============================================================"
          echo "NETWORK FOUNDATION READY"
          echo "============================================================"
