name: CloudMart Network Stack Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-network-stack
  TEMPLATE_FILE: cloudformation/network-stack.yaml


jobs:

  # ============================================================
  # JOB 1 — AWS ACCESS CHECK
  # ============================================================

  aws-access-check:

    name: 1. AWS Access Check

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |

          echo "============================================================"
          echo "AWS ACCESS CHECK"
          echo "============================================================"

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "CloudFormation Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS access verified."
          echo "============================================================"


  # ============================================================
  # JOB 2 — VALIDATE TEMPLATE
  # ============================================================

  validate-network-template:

    name: 2. Validate Network Template

    needs: aws-access-check

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |

          echo "============================================================"
          echo "CLOUDFORMATION TEMPLATE VALIDATION"
          echo "============================================================"

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Template:"
          echo "  $TEMPLATE_FILE"

          echo ""
          echo "Running CloudFormation validation..."

          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body "file://$TEMPLATE_FILE"

          echo ""
          echo "============================================================"
          echo "TEMPLATE VALIDATION SUCCESSFUL"
          echo "============================================================"


  # ============================================================
  # JOB 3 — DEPLOY NETWORK STACK
  # ============================================================

  deploy-network:

    name: 3. Deploy Network Stack

    needs: validate-network-template

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Show deployment plan
      # --------------------------------------------------------

      - name: Display network deployment plan
        run: |

          echo "################################################################"
          echo "#              NETWORK DEPLOYMENT STARTING                    #"
          echo "################################################################"

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Environment:"
          echo "  $ENVIRONMENT"

          echo ""
          echo "CloudFormation Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "CloudFormation Template:"
          echo "  $TEMPLATE_FILE"

          echo ""
          echo "Resources to be created:"
          echo ""
          echo "  1. VPC"
          echo "  2. Internet Gateway"
          echo "  3. Public Subnet"
          echo "  4. Private Subnet A"
          echo "  5. Private Subnet B"
          echo "  6. Public Route Table"
          echo "  7. Private Route Table"
          echo "  8. Lambda Security Group"
          echo "  9. RDS Security Group"
          echo " 10. EC2 Security Group"
          echo " 11. VPC Endpoint Security Group"
          echo " 12. S3 Gateway Endpoint"
          echo " 13. SSM Interface Endpoint"
          echo " 14. EventBridge Interface Endpoint"
          echo " 15. SNS Interface Endpoint"
          echo " 16. SQS Interface Endpoint"

          echo ""
          echo "Expected CloudFormation exports:"
          echo ""
          echo "  - cloudmart-dev-vpc-id"
          echo "  - cloudmart-dev-public-subnet"
          echo "  - cloudmart-dev-private-subnet-a"
          echo "  - cloudmart-dev-private-subnet-b"
          echo "  - cloudmart-dev-sg-lambda"
          echo "  - cloudmart-dev-sg-rds"
          echo "  - cloudmart-dev-sg-ec2"
          echo "  - cloudmart-dev-sg-vpce"

          echo ""
          echo "################################################################"


      # --------------------------------------------------------
      # Check whether old stack exists
      # --------------------------------------------------------

      - name: Check existing stack
        id: stack-check
        run: |

          echo "============================================================"
          echo "CHECKING EXISTING STACK"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo ""
          echo "Stack status:"
          echo "  $STATUS"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Delete failed stack
      # --------------------------------------------------------

      - name: Delete previous ROLLBACK_COMPLETE stack
        if: steps.stack-check.outputs.status == 'ROLLBACK_COMPLETE'
        run: |

          echo "============================================================"
          echo "REMOVING PREVIOUS FAILED STACK"
          echo "============================================================"

          echo ""
          echo "The stack is in ROLLBACK_COMPLETE."

          echo "CloudFormation cannot update a stack in this state."

          echo ""
          echo "Deleting:"
          echo "  $STACK_NAME"

          aws cloudformation delete-stack \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME"

          echo ""
          echo "Waiting for deletion..."

          aws cloudformation wait stack-delete-complete \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME"

          echo ""
          echo "Previous failed stack deleted."


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy CloudFormation network stack
        id: deploy
        run: |

          echo "============================================================"
          echo "DEPLOYING NETWORK CLOUDFORMATION STACK"
          echo "============================================================"

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "Template:"
          echo "  $TEMPLATE_FILE"

          echo ""
          echo "Creating/updating CloudFormation stack..."

          set +e

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --no-fail-on-empty-changeset

          DEPLOY_EXIT_CODE=$?

          set -e

          echo ""
          echo "CloudFormation deployment exit code:"
          echo "  $DEPLOY_EXIT_CODE"

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "################################################################"
            echo "#             NETWORK DEPLOYMENT FAILED                      #"
            echo "################################################################"

            echo ""
            echo "CloudFormation resource failure details:"
            echo ""

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            echo ""
            echo "Recent CloudFormation events:"
            echo ""

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            echo ""
            echo "Current stack status:"
            echo ""

            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].[StackName,StackStatus,StackStatusReason]" \
              --output table || true

            echo ""
            echo "################################################################"
            echo "#             END OF FAILURE DIAGNOSTICS                     #"
            echo "################################################################"

            exit "$DEPLOY_EXIT_CODE"

          fi

          echo ""
          echo "CloudFormation deployment completed successfully."


      # --------------------------------------------------------
      # Show resources
      # --------------------------------------------------------

      - name: Show deployed resources
        run: |

          echo "============================================================"
          echo "NETWORK STACK RESOURCES"
          echo "============================================================"

          aws cloudformation list-stack-resources \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "StackResourceSummaries[*].[LogicalResourceId,ResourceType,ResourceStatus]" \
            --output table


      # --------------------------------------------------------
      # Show outputs
      # --------------------------------------------------------

      - name: Show stack outputs
        run: |

          echo "============================================================"
          echo "NETWORK STACK OUTPUTS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table


      # --------------------------------------------------------
      # Show exports
      # --------------------------------------------------------

      - name: Show CloudFormation exports
        run: |

          echo "============================================================"
          echo "CLOUDFORMATION EXPORTS"
          echo "============================================================"

          aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].[Name,Value]" \
            --output table


  # ============================================================
  # JOB 4 — FINAL VERIFICATION
  # ============================================================

  verify-network:

    name: 4. Verify Network Stack

    needs: deploy-network

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify final stack
        run: |

          echo "################################################################"
          echo "#              FINAL NETWORK VERIFICATION                    #"
          echo "################################################################"

          STATUS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo ""
          echo "Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Final status:"
          echo "  $STATUS"

          if [ "$STATUS" != "CREATE_COMPLETE" ] && \
             [ "$STATUS" != "UPDATE_COMPLETE" ]; then

            echo ""
            echo "NETWORK STACK VERIFICATION FAILED"
            exit 1
          fi

          echo ""
          echo "CloudFormation exports:"
          echo ""

          aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?starts_with(Name, 'cloudmart-dev-')].[Name,Value]" \
            --output table

          echo ""
          echo "################################################################"
          echo "#              NETWORK STACK READY                           #"
          echo "################################################################"
