name: Deploy CloudMart Network

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-network-stack
  TEMPLATE_FILE: cloudformation/network-stack.yaml

jobs:

  # ============================================================
  # JOB 1 — VALIDATE NETWORK TEMPLATE
  # ============================================================

  validate-network:
    name: Validate Network CloudFormation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show AWS identity
        run: |
          echo "============================================================"
          echo "AWS IDENTITY"
          echo "============================================================"

          aws sts get-caller-identity

          echo ""
          echo "Region:"
          echo "${AWS_REGION}"

      - name: Validate network template
        run: |
          echo "============================================================"
          echo "VALIDATING NETWORK CLOUDFORMATION TEMPLATE"
          echo "============================================================"

          echo "Template:"
          echo "${TEMPLATE_FILE}"

          echo ""
          echo "Running CloudFormation validation..."

          aws cloudformation validate-template \
            --template-body file://${TEMPLATE_FILE}

          echo ""
          echo "============================================================"
          echo "NETWORK TEMPLATE VALIDATION SUCCESSFUL"
          echo "============================================================"


  # ============================================================
  # JOB 2 — DEPLOY NETWORK STACK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    needs:
      - validate-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # AWS IDENTITY
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "============================================================"
          echo "VERIFYING AWS CONNECTION"
          echo "============================================================"

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

      # --------------------------------------------------------
      # CHECK WHETHER STACK ALREADY EXISTS
      # --------------------------------------------------------

      - name: Check existing network stack
        run: |
          echo "============================================================"
          echo "CHECKING EXISTING CLOUDFORMATION STACK"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [ -z "$STATUS" ]; then
            echo "Stack does not currently exist."
            echo "CloudFormation will create:"
            echo "  ${STACK_NAME}"

          else
            echo "Existing stack found:"
            echo "  ${STACK_NAME}"

            echo "Current status:"
            echo "  ${STATUS}"

            if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
              echo ""
              echo "WARNING:"
              echo "Stack is in ROLLBACK_COMPLETE."
              echo "It must be deleted before CloudFormation can create"
              echo "the stack again."

              exit 1
            fi
          fi

      # --------------------------------------------------------
      # DEPLOY
      # --------------------------------------------------------

      - name: Deploy network stack
        run: |
          echo "============================================================"
          echo "STARTING NETWORK CLOUDFORMATION DEPLOYMENT"
          echo "============================================================"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Template:"
          echo "  ${TEMPLATE_FILE}"

          echo ""
          echo "Resources being deployed:"
          echo "  - VPC"
          echo "  - Internet Gateway"
          echo "  - Public Subnet"
          echo "  - Private Subnet A"
          echo "  - Private Subnet B"
          echo "  - Public Route Table"
          echo "  - Private Route Table"
          echo "  - Lambda Security Group"
          echo "  - RDS Security Group"
          echo "  - EC2 Security Group"
          echo "  - VPC Endpoint Security Group"
          echo "  - S3 Gateway Endpoint"
          echo "  - SSM Interface Endpoint"
          echo "  - EventBridge Interface Endpoint"
          echo "  - SNS Interface Endpoint"

          echo ""
          echo "No RDS instance is deployed by this job."
          echo "No NAT Gateway is deployed."
          echo "No application Lambda is deployed."

          echo ""
          echo "============================================================"
          echo "RUNNING CLOUDFORMATION DEPLOY"
          echo "============================================================"

          aws cloudformation deploy \
            --template-file "${TEMPLATE_FILE}" \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset

      # --------------------------------------------------------
      # PRINT STACK STATUS
      # --------------------------------------------------------

      - name: Print stack status
        if: always()
        run: |
          echo "============================================================"
          echo "CLOUDFORMATION STACK STATUS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].{StackName:StackName,Status:StackStatus}' \
            --output table || true

      # --------------------------------------------------------
      # PRINT STACK OUTPUTS
      # --------------------------------------------------------

      - name: Print network stack outputs
        if: success()
        run: |
          echo "============================================================"
          echo "NETWORK STACK OUTPUTS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[*].{Export:ExportName,Key:OutputKey,Value:OutputValue}' \
            --output table

      # --------------------------------------------------------
      # PRINT CLOUDFORMATION EVENTS IF DEPLOYMENT FAILS
      # --------------------------------------------------------

      - name: Show failed CloudFormation events
        if: failure()
        run: |
          echo "============================================================"
          echo "NETWORK DEPLOYMENT FAILED"
          echo "============================================================"

          echo ""
          echo "CloudFormation events:"
          echo ""

          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table || true

          echo ""
          echo "Recent CloudFormation events:"
          echo ""

          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --max-items 20 \
            --output table || true

      # --------------------------------------------------------
      # PRINT SUCCESS
      # --------------------------------------------------------

      - name: Network deployment successful
        if: success()
        run: |
          echo ""
          echo "################################################################"
          echo "#              NETWORK DEPLOYMENT SUCCESSFUL                 #"
          echo "################################################################"

          echo ""
          echo "CloudMart network stack deployed successfully."

          echo ""
          echo "Stack:"
          echo "  ${STACK_NAME}"

          echo ""
          echo "Region:"
          echo "  ${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "  ${ENVIRONMENT}"

          echo ""
          echo "The exported network resources are ready for"
          echo "the subsequent CloudMart infrastructure stacks."

          echo ""
          echo "################################################################"
