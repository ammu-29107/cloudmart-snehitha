name: CloudMart Network Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  NETWORK_STACK_NAME: cloudmart-dev-network

jobs:

  # ============================================================
  # JOB 1 — AWS ACCESS + TEMPLATE VALIDATION
  # ============================================================

  validate:
    name: Validate Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print deployment information
        run: |
          echo "============================================================"
          echo "CLOUDMART NETWORK DEPLOYMENT"
          echo "============================================================"
          echo "AWS Region      : $AWS_REGION"
          echo "Environment     : $ENVIRONMENT"
          echo "Stack           : $NETWORK_STACK_NAME"
          echo "Template        : cloudformation/network-stack.yaml"
          echo "============================================================"

      - name: Verify AWS identity
        run: |
          echo "============================================================"
          echo "VERIFYING AWS IDENTITY"
          echo "============================================================"

          aws sts get-caller-identity

          echo "============================================================"
          echo "AWS IDENTITY VERIFIED"
          echo "============================================================"

      - name: Validate CloudFormation template
        run: |
          echo "============================================================"
          echo "VALIDATING CLOUDFORMATION TEMPLATE"
          echo "============================================================"

          echo "Template:"
          echo "cloudformation/network-stack.yaml"

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

          echo "============================================================"
          echo "CLOUDFORMATION TEMPLATE VALIDATION SUCCESSFUL"
          echo "============================================================"


  # ============================================================
  # JOB 2 — DEPLOY NETWORK STACK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Check whether the stack already exists
      # --------------------------------------------------------

      - name: Check existing CloudFormation stack
        id: stack-check
        shell: bash
        run: |

          echo "============================================================"
          echo "CHECKING EXISTING CLOUDFORMATION STACK"
          echo "============================================================"

          echo "Stack:"
          echo "$NETWORK_STACK_NAME"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Current stack status:"
          echo "$STATUS"

          echo "stack_status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "============================================================"

      # --------------------------------------------------------
      # Delete failed stack
      # --------------------------------------------------------

      - name: Delete failed ROLLBACK_COMPLETE stack
        if: steps.stack-check.outputs.stack_status == 'ROLLBACK_COMPLETE'
        run: |

          echo "============================================================"
          echo "FAILED STACK DETECTED"
          echo "============================================================"

          echo "Stack:"
          echo "$NETWORK_STACK_NAME"

          echo "Status:"
          echo "ROLLBACK_COMPLETE"

          echo ""
          echo "CloudFormation cannot update a stack in"
          echo "ROLLBACK_COMPLETE state."
          echo ""
          echo "Deleting failed stack so it can be recreated..."
          echo "============================================================"

          aws cloudformation delete-stack \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION"

          echo "Waiting for stack deletion..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION"

          echo ""
          echo "============================================================"
          echo "FAILED STACK DELETED SUCCESSFULLY"
          echo "============================================================"

      # --------------------------------------------------------
      # Deploy network
      # --------------------------------------------------------

      - name: Deploy network CloudFormation stack
        shell: bash
        run: |

          echo "============================================================"
          echo "STARTING NETWORK CLOUDFORMATION DEPLOYMENT"
          echo "============================================================"

          echo "Region:"
          echo "$AWS_REGION"

          echo "Environment:"
          echo "$ENVIRONMENT"

          echo "Stack:"
          echo "$NETWORK_STACK_NAME"

          echo "Template:"
          echo "cloudformation/network-stack.yaml"

          echo ""
          echo "Resources being deployed:"
          echo "  - VPC"
          echo "  - Internet Gateway"
          echo "  - Public Subnet"
          echo "  - Private Subnet A"
          echo "  - Private Subnet B"
          echo "  - Public Route Table"
          echo "  - Private Route Table"
          echo "  - Lambda Security Group"
          echo "  - RDS Security Group"
          echo "  - EC2 Security Group"
          echo "  - VPC Endpoint Security Group"
          echo "  - S3 Gateway Endpoint"
          echo "  - SSM Interface Endpoint"
          echo "  - EventBridge Interface Endpoint"
          echo "  - SNS Interface Endpoint"
          echo "  - SQS Interface Endpoint"

          echo ""
          echo "============================================================"

          aws cloudformation deploy \
            --stack-name "$NETWORK_STACK_NAME" \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      # --------------------------------------------------------
      # Print stack status
      # --------------------------------------------------------

      - name: Show final stack status
        if: always()
        run: |

          echo "============================================================"
          echo "FINAL CLOUDFORMATION STACK STATUS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].{StackName:StackName,Status:StackStatus,StatusReason:StackStatusReason}" \
            --output table || true

      # --------------------------------------------------------
      # Print CloudFormation events if deployment failed
      # --------------------------------------------------------

      - name: Show failed CloudFormation events
        if: failure()
        run: |

          echo "============================================================"
          echo "NETWORK DEPLOYMENT FAILED"
          echo "============================================================"

          echo ""
          echo "Recent CloudFormation events:"
          echo ""

          aws cloudformation describe-stack-events \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo ""
          echo "============================================================"
          echo "END OF FAILURE DIAGNOSTICS"
          echo "============================================================"

      # --------------------------------------------------------
      # Verify successful deployment
      # --------------------------------------------------------

      - name: Verify network deployment
        run: |

          echo "============================================================"
          echo "VERIFYING NETWORK STACK"
          echo "============================================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status:"
          echo "$STATUS"

          if [ "$STATUS" != "CREATE_COMPLETE" ] && \
             [ "$STATUS" != "UPDATE_COMPLETE" ]; then

            echo ""
            echo "NETWORK STACK VERIFICATION FAILED"
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "NETWORK STACK DEPLOYED SUCCESSFULLY"
          echo "============================================================"

      # --------------------------------------------------------
      # Display important outputs
      # --------------------------------------------------------

      - name: Display network stack outputs
        run: |

          echo "============================================================"
          echo "NETWORK STACK OUTPUTS"
          echo "============================================================"

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue,Description]" \
            --output table

          echo ""
          echo "============================================================"
          echo "NETWORK DEPLOYMENT COMPLETE"
          echo "============================================================"
