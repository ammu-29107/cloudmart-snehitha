name: CloudMart Deploy - Network, Database, Storage, Eventbus, Product


on:

  push:

    branches:
      - main

    paths:

      - 'cloudformation/network-stack.yaml'
      - 'cloudformation/database-stack.yaml'
      - 'cloudformation/storage-stack.yaml'
      - 'cloudformation/eventbus-stack.yaml'
      - 'cloudformation/product-stack.yaml'

      - 'src/product/**'
      - 'src/authorizer/**'
      - 'src/shared/**'
      - 'src/schema-apply/**'

      - '.github/workflows/deploy.yaml'


  workflow_dispatch:


permissions:

  id-token: write
  contents: read


jobs:


  # ============================================================
  # JOB 0
  # VALIDATE TEMPLATES
  # ============================================================

  validate-templates:

    name: Validate Templates

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ secrets.AWS_REGION }}


      - name: Verify identity

        run: |

          aws sts get-caller-identity


      - name: Validate all CloudFormation templates

        run: |

          for tpl in \
            cloudformation/network-stack.yaml \
            cloudformation/database-stack.yaml \
            cloudformation/storage-stack.yaml \
            cloudformation/eventbus-stack.yaml \
            cloudformation/product-stack.yaml
          do

            echo "Validating $tpl"

            test -s "$tpl" || {
              echo "ERROR: $tpl is empty."
              exit 1
            }

            aws cloudformation validate-template \
              --template-body "file://$tpl"

          done


  # ============================================================
  # JOB 1
  # NETWORK
  # ============================================================

  deploy-network:

    name: Deploy network-stack

    runs-on: ubuntu-latest

    needs:
      - validate-templates

    env:

      STACK_NAME: cloudmart-dev-network

      TEMPLATE_FILE: cloudformation/network-stack.yaml

      CHANGESET_NAME: cs-network-${{ github.run_id }}-${{ github.run_attempt }}


    steps:

      - uses: actions/checkout@v4


      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ secrets.AWS_REGION }}


      - name: Determine change set type

        id: stack-check

        run: |

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")


          echo "Current stack status: $STACK_STATUS"


          if [ "$STACK_STATUS" = "NOT_FOUND" ] ||
             [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then

            echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"


          elif [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] ||
               [ "$STACK_STATUS" = "ROLLBACK_FAILED" ]; then

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME"

            echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"


          else

            echo "changeset_type=UPDATE" >> "$GITHUB_OUTPUT"

          fi


      - name: Create change set

        run: |

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --change-set-type "${{ steps.stack-check.outputs.changeset_type }}" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              ParameterKey=Environment,ParameterValue=dev \
            --capabilities CAPABILITY_NAMED_IAM


      # ========================================================
      # WAIT FOR CHANGE SET
      # ========================================================

      - name: Wait for change set

        run: |

          for i in $(seq 1 20); do

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'Status' \
              --output text)


            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'StatusReason' \
              --output text)


            echo "Attempt $i/20 - Status: $STATUS"

            echo "Reason: $REASON"


            if [ "$STATUS" = "CREATE_COMPLETE" ]; then

              echo "ready=true" >> "$GITHUB_ENV"

              break


            elif [ "$STATUS" = "FAILED" ]; then

              echo

              echo "======================================================"

              echo "CHANGE SET FAILED"

              echo "======================================================"

              echo "Status: $STATUS"

              echo "Reason: $REASON"

              echo


              echo "Full change set details:"

              aws cloudformation describe-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME" \
                --output json || true


              echo

              echo "CloudFormation events:"

              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query 'StackEvents[:20].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                --output table || true


              if echo "$REASON" |
                grep -qi "didn't contain changes\|No updates"; then

                echo "No changes to deploy."

                echo "ready=nochange" >> "$GITHUB_ENV"

                break

              else

                exit 1

              fi


            else

              sleep 15

            fi

          done


      - name: Execute change set

        if: env.ready == 'true'

        run: |

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME"


      - name: Wait for stack

        if: env.ready == 'true'

        run: |

          for i in $(seq 1 40); do

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)


            echo "Attempt $i/40 - Stack status: $STATUS"


            case "$STATUS" in

              CREATE_COMPLETE|UPDATE_COMPLETE)

                exit 0
                ;;


              *IN_PROGRESS)

                sleep 30
                ;;


              *FAILED|*ROLLBACK_COMPLETE)

                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --query 'StackEvents[:15].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                  --output table

                exit 1
                ;;


              *)

                sleep 30
                ;;

            esac

          done


  # ============================================================
  # JOB 2
  # DATABASE
  # ============================================================

  deploy-database:

    name: Deploy database-stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network

    env:

      STACK_NAME: cloudmart-dev-database

      TEMPLATE_FILE: cloudformation/database-stack.yaml

      CHANGESET_NAME: cs-database-${{ github.run_id }}-${{ github.run_attempt }}


    steps:

      - uses: actions/checkout@v4


      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ secrets.AWS_REGION }}


      # ========================================================
      # DETERMINE CHANGE SET TYPE
      # ========================================================

      - name: Determine change set type

        id: stack-check

        run: |

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")


          echo "Current stack status: $STACK_STATUS"


          if [ "$STACK_STATUS" = "NOT_FOUND" ] ||
             [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then

            echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"


          elif [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] ||
               [ "$STACK_STATUS" = "ROLLBACK_FAILED" ]; then

            echo "Database stack is in $STACK_STATUS."

            echo "Deleting failed stack before recreating it..."


            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME"


            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME"


            echo "changeset_type=CREATE" >> "$GITHUB_OUTPUT"


          else

            echo "changeset_type=UPDATE" >> "$GITHUB_OUTPUT"

          fi


      # ========================================================
      # CREATE CHANGE SET
      # ========================================================

      - name: Create change set

        run: |

          test -s "$TEMPLATE_FILE" || {
            echo "ERROR: $TEMPLATE_FILE is empty."
            exit 1
          }


          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --change-set-type "${{ steps.stack-check.outputs.changeset_type }}" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              ParameterKey=Environment,ParameterValue=dev \
              ParameterKey=DbInstanceClass,ParameterValue=db.t3.micro \
              ParameterKey=DbPassword,ParameterValue="${{ secrets.DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM


      # ========================================================
      # WAIT FOR CHANGE SET
      # ========================================================

      - name: Wait for change set

        run: |

          for i in $(seq 1 20); do

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'Status' \
              --output text)


            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'StatusReason' \
              --output text)


            echo "Attempt $i/20 - Status: $STATUS"


            if [ "$STATUS" = "CREATE_COMPLETE" ]; then

              echo "ready=true" >> "$GITHUB_ENV"

              break


            elif [ "$STATUS" = "FAILED" ]; then

              echo "Change set failed."

              echo "Reason: $REASON"

              echo
              echo "======================================================"
              echo "FULL CHANGE SET DETAILS"
              echo "======================================================"

              aws cloudformation describe-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME" \
                --output json || true

              echo
              echo "======================================================"
              echo "CLOUDFORMATION DESCRIBE EVENTS"
              echo "======================================================"

              aws cloudformation describe-events \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME" \
                --region "${{ secrets.AWS_REGION }}" \
                --output json || true

              echo
              echo "======================================================"
              echo "RECENT STACK EVENTS"
              echo "======================================================"

              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query 'StackEvents[:20].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                --output table || true

              echo

              if echo "$REASON" |
                grep -qi "didn't contain changes\|No updates"; then

                echo "No changes to deploy."

                echo "ready=nochange" >> "$GITHUB_ENV"

                break

              else

                exit 1

              fi


            else

              sleep 15

            fi

          done


      # ========================================================
      # EXECUTE CHANGE SET
      # ========================================================

      - name: Execute change set

        if: env.ready == 'true'

        run: |

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME"


      # ========================================================
      # WAIT FOR DATABASE STACK
      # ========================================================

      - name: Wait for database stack

        if: env.ready == 'true'

        run: |

          for i in $(seq 1 60); do

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)


            echo "Attempt $i/60 - Stack status: $STATUS"


            case "$STATUS" in

              CREATE_COMPLETE|UPDATE_COMPLETE)

                echo "Database stack deployed successfully."

                exit 0
                ;;


              *IN_PROGRESS)

                sleep 30
                ;;


              *FAILED|*ROLLBACK_COMPLETE)

                echo "Database stack failed."


                aws cloudformation describe-stack-events \
                  --stack-name "$STACK_NAME" \
                  --query 'StackEvents[:15].{Time:Timestamp,Status:ResourceStatus,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
                  --output table


                exit 1
                ;;


              *)

                sleep 30
                ;;

            esac

          done


      # ========================================================
      # STORE DATABASE PASSWORD IN SSM SECURESTRING
      # ========================================================

      - name: Store database password in SSM SecureString

        if: env.ready == 'true'

        run: |

          echo "Storing database password in SSM SecureString..."


          aws ssm put-parameter \
            --name "/cloudmart/dev/database/password" \
            --value "${{ secrets.DB_PASSWORD }}" \
            --type SecureString \
            --overwrite


          echo "Database password stored in SSM SecureString."


      # ========================================================
      # STORE DATABASE PASSWORD IN SSM SECURESTRING
      # ========================================================

      - name: Store database password in SSM SecureString

        if: env.ready == 'true'

        run: |

          echo "Storing database password in SSM SecureString..."

          aws ssm put-parameter \
            --name "/cloudmart/dev/database/password" \
            --value "${{ secrets.DB_PASSWORD }}" \
            --type SecureString \
            --overwrite

          echo "Database password stored in SSM SecureString."


      # ========================================================
      # VERIFY DATABASE SSM PARAMETERS
      # ========================================================

      - name: Verify database SSM parameters

        if: env.ready == 'true'

        run: |

          echo "Checking database SSM parameters..."


          # ----------------------------------------------------
          # DATABASE HOST
          # ----------------------------------------------------

          aws ssm get-parameter \
            --name "/cloudmart/dev/database/host" \
            --query "Parameter.Name" \
            --output text


          # ----------------------------------------------------
          # DATABASE NAME
          # ----------------------------------------------------

          aws ssm get-parameter \
            --name "/cloudmart/dev/database/name" \
            --query "Parameter.Name" \
            --output text


          # ----------------------------------------------------
          # DATABASE USERNAME
          # ----------------------------------------------------

          aws ssm get-parameter \
            --name "/cloudmart/dev/database/username" \
            --query "Parameter.Name" \
            --output text


          # ----------------------------------------------------
          # DATABASE PASSWORD
          #
          # We intentionally DO NOT use --with-decryption here.
          #
          # We only need to verify that the SecureString exists.
          # The password itself must not be printed into the
          # GitHub Actions logs.
          # ----------------------------------------------------

          aws ssm get-parameter \
            --name "/cloudmart/dev/database/password" \
            --query "Parameter.{Name:Name,Type:Type}" \
            --output table


          echo "Database SSM parameters verified successfully."


  # ============================================================
  # JOB 3
  # STORAGE
  # ============================================================

  deploy-storage:

    name: Deploy storage-stack

    runs-on: ubuntu-latest

    needs:
      - deploy-database

