AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart database stack — RDS MySQL, single-AZ, in private subnets.
  The database password is supplied securely by GitHub Actions using
  the DB_PASSWORD GitHub Secret and stored in SSM Parameter Store
  as a SecureString. No Secrets Manager database secret is created.


Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod

  DbInstanceClass:
    Type: String
    Default: db.t3.micro

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 12


Resources:


  # ============================================================
  # DB SUBNET GROUP
  # ============================================================

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: !Sub
        - cloudmart-${Environment}-db-subnet-group
        - Environment: !Ref Environment

      SubnetIds:

        - Fn::ImportValue: !Sub
            - cloudmart-${Environment}-private-subnet-a
            - Environment: !Ref Environment

        - Fn::ImportValue: !Sub
            - cloudmart-${Environment}-private-subnet-b
            - Environment: !Ref Environment


  # ============================================================
  # RDS MYSQL
  # ============================================================

  RdsInstance:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot

    Properties:

      DBInstanceIdentifier: !Sub
        - cloudmart-${Environment}-mysql
        - Environment: !Ref Environment

      Engine: mysql

      EngineVersion: '8.0'

      DBInstanceClass:
        !Ref DbInstanceClass

      AllocatedStorage: '20'

      StorageType: gp2

      DBName: cloudmart

      MasterUsername: cloudmart_admin

      MasterUserPassword:
        !Ref DbPassword

      MultiAZ: false

      DBSubnetGroupName:
        !Ref DbSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue: !Sub
            - cloudmart-${Environment}-sg-rds
            - Environment: !Ref Environment

      PubliclyAccessible: false

      StorageEncrypted: true

      BackupRetentionPeriod: 1


  # ============================================================
  # SSM DATABASE HOST
  # ============================================================

  DatabaseHostParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        - /cloudmart/${Environment}/database/host
        - Environment: !Ref Environment

      Type: String

      Value:
        !GetAtt RdsInstance.Endpoint.Address

      Description: !Sub
        - CloudMart ${Environment} RDS endpoint
        - Environment: !Ref Environment


  # ============================================================
  # SSM DATABASE NAME
  # ============================================================

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        - /cloudmart/${Environment}/database/name
        - Environment: !Ref Environment

      Type: String

      Value: cloudmart

      Description: !Sub
        - CloudMart ${Environment} database name
        - Environment: !Ref Environment


  # ============================================================
  # SSM DATABASE USERNAME
  # ============================================================

  DatabaseUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        - /cloudmart/${Environment}/database/username
        - Environment: !Ref Environment

      Type: String

      Value: cloudmart_admin

      Description: !Sub
        - CloudMart ${Environment} database username
        - Environment: !Ref Environment



# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  # ============================================================
  # RDS ENDPOINT
  # ============================================================

  RdsEndpointAddress:

    Description: RDS endpoint address

    Value:
      !GetAtt RdsInstance.Endpoint.Address

    Export:
      Name: !Sub
        - cloudmart-${Environment}-rds-endpoint
        - Environment: !Ref Environment


  # ============================================================
  # RDS PORT
  # ============================================================

  RdsEndpointPort:

    Description: RDS endpoint port

    Value:
      !GetAtt RdsInstance.Endpoint.Port

    Export:
      Name: !Sub
        - cloudmart-${Environment}-rds-port
        - Environment: !Ref Environment


  # ============================================================
  # SSM PASSWORD PARAMETER NAME
  # ============================================================

  RdsSsmPasswordParameter:

    Description: >
      SSM Parameter Store SecureString containing the
      RDS master password.

    Value: !Sub
      - /cloudmart/${Environment}/database/password
      - Environment: !Ref Environment

    Export:
      Name: !Sub
        - cloudmart-${Environment}-rds-password-param
        - Environment: !Ref Environment