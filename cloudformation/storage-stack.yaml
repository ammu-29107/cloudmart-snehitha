AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart storage-stack — private S3 buckets, AWS-managed encryption, Block Public Access on

Parameters:
  Environment:
    Type: String

Resources:
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cloudmart-${Environment}-reports-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cloudmart-${Environment}-lambda-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
    Export: {Name: !Sub 'cloudmart-${Environment}-reports-bucket'}
  LambdaArtifactsBucketName:
    Value: !Ref LambdaArtifactsBucket
    Export: {Name: !Sub 'cloudmart-${Environment}-lambda-artifacts-bucket'}