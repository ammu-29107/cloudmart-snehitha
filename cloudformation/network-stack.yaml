AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart network stack containing the VPC, one public subnet, two private
  subnets, Internet Gateway, route tables, security groups, and VPC endpoints.
  Private subnet B exists only to satisfy the RDS DB subnet group requirement
  for subnets in two Availability Zones. No NAT Gateway is used.

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod

Mappings:

  CidrMap:

    dev:
      Vpc: 10.0.0.0/16
      PublicSubnet: 10.0.1.0/24
      PrivateSubnetA: 10.0.11.0/24
      PrivateSubnetB: 10.0.12.0/24

    prod:
      Vpc: 10.1.0.0/16
      PublicSubnet: 10.1.1.0/24
      PrivateSubnetA: 10.1.11.0/24
      PrivateSubnetB: 10.1.12.0/24

Resources:

  # ============================================================
  # VPC
  # ============================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap
        - CidrMap
        - !Ref Environment
        - Vpc
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ============================================================
  # PUBLIC SUBNET
  # ============================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap
        - CidrMap
        - !Ref Environment
        - PublicSubnet
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-a

  # ============================================================
  # PRIVATE SUBNET A
  # Lambda + RDS
  # ============================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap
        - CidrMap
        - !Ref Environment
        - PrivateSubnetA
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-a

  # ============================================================
  # PRIVATE SUBNET B
  # RDS DB SUBNET GROUP REQUIREMENT ONLY
  # ============================================================

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap
        - CidrMap
        - !Ref Environment
        - PrivateSubnetB
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-b
        - Key: Purpose
          Value: RDS subnet group AZ requirement only

  # ============================================================
  # PUBLIC ROUTE TABLE
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-rt

  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============================================================
  # PRIVATE ROUTE TABLE
  # No NAT Gateway / no Internet route
  # ============================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-rt

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================
  # SECURITY GROUP - LAMBDA
  # ============================================================

  SgLambda:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions with no inbound traffic
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sg-lambda

  # ============================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ============================================================

  SgVpce:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC endpoints accepting HTTPS from Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref SgLambda
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sg-vpce

  # ============================================================
  # SECURITY GROUP - EC2
  # ============================================================

  SgEc2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 dashboard access
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sg-ec2

  # ============================================================
  # SECURITY GROUP - RDS
  # ============================================================

  SgRds:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL access from Lambda and EC2 only
      VpcId: !Ref Vpc
      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SgLambda

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SgEc2

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sg-rds

  # ============================================================
  # LAMBDA -> RDS
  # ============================================================

  SgLambdaEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SgLambda
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref SgRds

  # ============================================================
  # LAMBDA -> VPC ENDPOINTS
  # ============================================================

  SgLambdaEgressToVpce:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SgLambda
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref SgVpce

  # ============================================================
  # S3 GATEWAY VPC ENDPOINT
  # ============================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ============================================================
  # SSM INTERFACE ENDPOINT
  # ============================================================

  SsmInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref SgVpce

  # ============================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ============================================================

  EventBridgeInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.events
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref SgVpce

  # ============================================================
  # SNS INTERFACE ENDPOINT
  # ============================================================

  SnsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref SgVpce

  # ============================================================
  # SQS INTERFACE ENDPOINT
  # ============================================================

  SqsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref SgVpce

# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub cloudmart-${Environment}-vpc-id

  PublicSubnetId:
    Description: CloudMart public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub cloudmart-${Environment}-public-subnet

  PrivateSubnetAId:
    Description: CloudMart private subnet A
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-a

  PrivateSubnetBId:
    Description: CloudMart private subnet B for RDS subnet group requirement
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-b

  SgLambdaId:
    Description: Lambda security group
    Value: !Ref SgLambda
    Export:
      Name: !Sub cloudmart-${Environment}-sg-lambda

  SgRdsId:
    Description: RDS security group
    Value: !Ref SgRds
    Export:
      Name: !Sub cloudmart-${Environment}-sg-rds

  SgEc2Id:
    Description: EC2 security group
    Value: !Ref SgEc2
    Export:
      Name: !Sub cloudmart-${Environment}-sg-ec2
