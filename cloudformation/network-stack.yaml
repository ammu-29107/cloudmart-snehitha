AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Milestone 2 network stack.
  Creates the VPC, public subnet, two private subnets in separate
  Availability Zones, Internet Gateway, route tables, security groups,
  and required VPC endpoints. No NAT Gateway is deployed.
  Private subnet B exists to satisfy the RDS DB subnet group
  two-Availability-Zone requirement and does not imply Multi-AZ RDS.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment.

  DashboardAccessCidr:
    Type: String
    Default: 203.0.113.0/32
    Description: >
      CIDR allowed to access the EC2 operations dashboard.
      Replace this with the required trusted IP/CIDR if the
      dashboard is deployed.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # VPC
  # ==========================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc

  # ==========================================================
  # INTERNET GATEWAY
  # ==========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ==========================================================
  # PUBLIC SUBNET
  # ==========================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ""

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet

  # ==========================================================
  # PRIVATE SUBNET A
  #
  # Primary private subnet for Lambda/RDS-related resources.
  # ==========================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ""

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-a

  # ==========================================================
  # PRIVATE SUBNET B
  #
  # Exists in another AZ because RDS DB subnet groups require
  # subnets in at least two Availability Zones.
  #
  # This does NOT mean RDS is configured as Multi-AZ.
  # ==========================================================

  PrivateSubnetB:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24

      AvailabilityZone:
        !Select
          - 1
          - !GetAZs ""

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-b

        - Key: Purpose
          Value: RDS DB subnet group second-AZ requirement

  # ==========================================================
  # PUBLIC ROUTE TABLE
  # ==========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-route-table

  PublicInternetRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - InternetGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ==========================================================
  # PRIVATE ROUTE TABLE
  #
  # IMPORTANT:
  # No 0.0.0.0/0 route is configured.
  # Therefore private resources do not receive direct
  # Internet access through a NAT Gateway.
  # ==========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-route-table

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ==========================================================
  # SECURITY GROUP - LAMBDA
  # ==========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart Lambda functions.
        No inbound connections are required.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg

  # ==========================================================
  # SECURITY GROUP - RDS
  # ==========================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart RDS MySQL.
        MySQL access is allowed only from approved application
        security groups.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg

  # ==========================================================
  # SECURITY GROUP - EC2 DASHBOARD
  # ==========================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart operations dashboard.

      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: !Ref DashboardAccessCidr
          Description: Dashboard HTTP access from trusted CIDR

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-sg

  # ==========================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ==========================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart interface VPC endpoints.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc-endpoint-sg

  # ==========================================================
  # RDS INGRESS FROM LAMBDA
  # ==========================================================

  RDSIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Description: Lambda to RDS MySQL

  # ==========================================================
  # RDS INGRESS FROM EC2
  # ==========================================================

  RDSIngressFromEC2:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EC2SecurityGroup

      Description: EC2 dashboard to RDS MySQL

  # ==========================================================
  # VPC ENDPOINT INGRESS FROM LAMBDA
  # ==========================================================

  EndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Description: Lambda to AWS interface endpoints

  # ==========================================================
  # LAMBDA EGRESS TO RDS
  # ==========================================================

  LambdaEgressToRDS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup

      Description: Lambda to RDS MySQL

  # ==========================================================
  # LAMBDA EGRESS TO VPC ENDPOINTS
  # ==========================================================

  LambdaEgressToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup

      Description: Lambda to AWS interface endpoints

  # ==========================================================
  # EC2 EGRESS TO RDS
  # ==========================================================

  EC2EgressToRDS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup

      Description: EC2 dashboard to RDS

  # ==========================================================
  # S3 GATEWAY ENDPOINT
  # ==========================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.s3

      VpcEndpointType: Gateway

      RouteTableIds:
        - !Ref PrivateRouteTable

  # ==========================================================
  # SSM INTERFACE ENDPOINT
  # ==========================================================

  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.ssm

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # ==========================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ==========================================================

  EventBridgeInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.events

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # ==========================================================
  # SNS INTERFACE ENDPOINT
  # ==========================================================

  SNSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.sns

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref VPC

    Export:
      Name: !Sub cloudmart-${Environment}-vpc-id

  PublicSubnetId:
    Description: CloudMart public subnet ID
    Value: !Ref PublicSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-public-subnet-id

  PrivateSubnetAId:
    Description: CloudMart private subnet A ID
    Value: !Ref PrivateSubnetA

    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-a-id

  PrivateSubnetBId:
    Description: CloudMart private subnet B ID
    Value: !Ref PrivateSubnetB

    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-b-id

  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-lambda-sg-id

  RDSSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref RDSSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-rds-sg-id

  EC2SecurityGroupId:
    Description: EC2 dashboard security group ID
    Value: !Ref EC2SecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-ec2-sg-id

  VPCEndpointSecurityGroupId:
    Description: VPC endpoint security group ID
    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-vpc-endpoint-sg-id

  PrivateRouteTableId:
    Description: Private route table ID
    Value: !Ref PrivateRouteTable

    Export:
      Name: !Sub cloudmart-${Environment}-private-route-table-id

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable

    Export:
      Name: !Sub cloudmart-${Environment}-public-route-table-id
