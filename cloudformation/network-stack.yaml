AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Milestone 2 network stack.
  Creates the VPC, public subnet, two private subnets in separate
  Availability Zones, Internet Gateway, route tables, security groups,
  and required VPC endpoints. No NAT Gateway is deployed.
  Private subnet B exists to satisfy the RDS DB subnet group
  two-Availability-Zone requirement and does not imply Multi-AZ RDS.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ============================================================
  # VPC
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # INTERNET GATEWAY
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw

        - Key: Project
          Value: CloudMart

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================
  # PUBLIC SUBNET
  # ============================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ""

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # PRIVATE SUBNET A
  # ============================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ""

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-a

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # PRIVATE SUBNET B
  #
  # Required so the future RDS DB subnet group can span
  # at least two Availability Zones.
  #
  # This does NOT enable Multi-AZ RDS.
  # ============================================================

  PrivateSubnetB:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24

      AvailabilityZone:
        !Select
          - 1
          - !GetAZs ""

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-b

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

        - Key: Purpose
          Value: RDS DB subnet group second Availability Zone

  # ============================================================
  # PUBLIC ROUTE TABLE
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-route-table

        - Key: Project
          Value: CloudMart

  # ============================================================
  # PUBLIC INTERNET ROUTE
  # ============================================================

  PublicInternetRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - InternetGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # ============================================================
  # PUBLIC SUBNET ASSOCIATION
  # ============================================================

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============================================================
  # PRIVATE ROUTE TABLE
  #
  # No Internet/NAT route.
  # ============================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-route-table

        - Key: Project
          Value: CloudMart

  # ============================================================
  # PRIVATE SUBNET A ASSOCIATION
  # ============================================================

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================
  # PRIVATE SUBNET B ASSOCIATION
  # ============================================================

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================
  # SECURITY GROUP - LAMBDA
  # ============================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart Lambda functions.
        Lambda functions do not require inbound connections.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # SECURITY GROUP - RDS
  # ============================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart RDS MySQL.
        MySQL access is permitted from the Lambda security group.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ============================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: >
        Security group for CloudMart interface VPC endpoints.

      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc-endpoint-sg

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # RDS INGRESS FROM LAMBDA
  # ============================================================

  RDSIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Description: Lambda to RDS MySQL

  # ============================================================
  # VPC ENDPOINT INGRESS FROM LAMBDA
  # ============================================================

  EndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Description: Lambda to AWS interface VPC endpoints

  # ============================================================
  # LAMBDA EGRESS TO RDS
  # ============================================================

  LambdaEgressToRDS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup

      Description: Lambda to RDS MySQL

  # ============================================================
  # LAMBDA EGRESS TO VPC ENDPOINTS
  # ============================================================

  LambdaEgressToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup

      Description: Lambda to AWS interface VPC endpoints

  # ============================================================
  # S3 GATEWAY ENDPOINT
  #
  # No hourly endpoint charge.
  # Allows private resources to access S3 without NAT.
  # ============================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.s3

      VpcEndpointType: Gateway

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-s3-endpoint

        - Key: Project
          Value: CloudMart

  # ============================================================
  # SSM INTERFACE ENDPOINT
  # ============================================================

  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.ssm

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint

        - Key: Project
          Value: CloudMart

  # ============================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ============================================================

  EventBridgeInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.events

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-events-endpoint

        - Key: Project
          Value: CloudMart

  # ============================================================
  # SNS INTERFACE ENDPOINT
  # ============================================================

  SNSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref VPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.sns

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnetA

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sns-endpoint

        - Key: Project
          Value: CloudMart

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref VPC

    Export:
      Name: !Sub cloudmart-${Environment}-vpc-id

  PublicSubnetId:
    Description: CloudMart public subnet ID
    Value: !Ref PublicSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-public-subnet-id

  PrivateSubnetAId:
    Description: CloudMart private subnet A ID
    Value: !Ref PrivateSubnetA

    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-a-id

  PrivateSubnetBId:
    Description: CloudMart private subnet B ID
    Value: !Ref PrivateSubnetB

    Export:
      Name: !Sub cloudmart-${Environment}-private-subnet-b-id

  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-lambda-sg-id

  RDSSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref RDSSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-rds-sg-id

  VPCEndpointSecurityGroupId:
    Description: VPC endpoint security group ID
    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-vpc-endpoint-sg-id

  PrivateRouteTableId:
    Description: CloudMart private route table ID
    Value: !Ref PrivateRouteTable

    Export:
      Name: !Sub cloudmart-${Environment}-private-route-table-id

  PublicRouteTableId:
    Description: CloudMart public route table ID
    Value: !Ref PublicRouteTable

    Export:
      Name: !Sub cloudmart-${Environment}-public-route-table-id
