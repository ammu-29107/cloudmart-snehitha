AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart product service with a dedicated Lambda-based
  authorization service. Product Lambda and Authorizer Lambda
  both use Lambda Function URLs. No API Gateway and no auth-stack.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LambdaCodeKey:
    Type: String

  AuthorizerCodeKey:
    Type: String

  SchemaApplyCodeKey:
    Type: String

  AlertEmail:
    Type: String


Resources:

  # ============================================================
  # AUTHORIZE LAMBDA ROLE
  # ============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerSSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

        - PolicyName: AuthorizerLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


  # ============================================================
  # AUTHORIZE LAMBDA
  # ============================================================

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt AuthorizerLambdaRole.Arn

      Timeout: 10

      MemorySize: 128

      Code:
        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref AuthorizerCodeKey

      Environment:
        Variables:

          AUTH_TOKEN_PARAM: !Sub /cloudmart/${Environment}/auth/token

          ENVIRONMENT: !Ref Environment


  # ============================================================
  # AUTHORIZE LAMBDA FUNCTION URL
  # ============================================================

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:

      TargetFunctionArn:
        !GetAtt AuthorizerFunction.Arn

      AuthType: NONE


  # ============================================================
  # AUTHORIZE FUNCTION URL PERMISSION
  # ============================================================

  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName:
        !Ref AuthorizerFunction

      Action:
        lambda:InvokeFunctionUrl

      Principal: '*'

      FunctionUrlAuthType:
        NONE


  # ============================================================
  # PRODUCT LAMBDA ROLE
  # ============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # --------------------------------------------------------
        # SSM
        # --------------------------------------------------------

        - PolicyName: ProductSSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/inventory/low-stock-threshold


        # --------------------------------------------------------
        # CloudWatch Logs
        # --------------------------------------------------------

        - PolicyName: ProductLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


        # --------------------------------------------------------
        # EventBridge
        # --------------------------------------------------------

        - PolicyName: ProductEventBridge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-bus


        # --------------------------------------------------------
        # SNS
        # --------------------------------------------------------

        - PolicyName: ProductSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish

                Resource:
                  - !Ref LowStockTopic


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product

      Runtime:
        python3.12

      # IMPORTANT:
      # src/product/handler.py
      # contains def handler(event, context)
      Handler:
        handler.handler

      Role:
        !GetAtt ProductLambdaRole.Arn

      Timeout:
        30

      MemorySize:
        128

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref LambdaCodeKey

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          # ------------------------------------------------------
          # Dedicated Authorizer Function URL
          # ------------------------------------------------------

          AUTHORIZER_URL:
            !GetAtt AuthorizerFunctionUrl.FunctionUrl

          # ------------------------------------------------------
          # Database parameter names
          #
          # Values are retrieved at runtime.
          # ------------------------------------------------------

          DB_HOST_PARAM:
            !Sub /cloudmart/${Environment}/database/host

          DB_NAME_PARAM:
            !Sub /cloudmart/${Environment}/database/name

          DB_USER_PARAM:
            !Sub /cloudmart/${Environment}/database/username

          DB_PASSWORD_PARAM:
            !Sub /cloudmart/${Environment}/database/password

          # ------------------------------------------------------
          # Inventory
          # ------------------------------------------------------

          LOW_STOCK_THRESHOLD_PARAM:
            !Sub /cloudmart/${Environment}/inventory/low-stock-threshold

          # ------------------------------------------------------
          # EventBridge
          # ------------------------------------------------------

          EVENT_BUS_NAME:
            !Sub cloudmart-${Environment}-bus

          # ------------------------------------------------------
          # SNS
          # ------------------------------------------------------

          LOW_STOCK_TOPIC_ARN:
            !Ref LowStockTopic


  # ============================================================
  # PRODUCT FUNCTION URL
  # ============================================================

  ProductFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:

      TargetFunctionArn:
        !GetAtt ProductLambda.Arn

      AuthType:
        NONE


  # ============================================================
  # PRODUCT FUNCTION URL PERMISSION
  # ============================================================

  ProductFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunctionUrl

      Principal: '*'

      FunctionUrlAuthType:
        NONE


  # ============================================================
  # LOW STOCK SNS TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock


  # ============================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ============================================================
  # SCHEMA APPLY ROLE
  # ============================================================

  SchemaApplyRole:
    Type: AWS::IAM::Role
    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-schema-apply-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: SchemaApplySSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password


        - PolicyName: SchemaApplyLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


  # ============================================================
  # SCHEMA APPLY LAMBDA
  # ============================================================

  SchemaApplyFunction:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-apply

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !GetAtt SchemaApplyRole.Arn

      Timeout:
        120

      MemorySize:
        256

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref SchemaApplyCodeKey

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAM:
            !Sub /cloudmart/${Environment}/database/host

          DB_NAME_PARAM:
            !Sub /cloudmart/${Environment}/database/name

          DB_USER_PARAM:
            !Sub /cloudmart/${Environment}/database/username

          DB_PASSWORD_PARAM:
            !Sub /cloudmart/${Environment}/database/password


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ProductFunctionUrl:
    Description: Product Lambda Function URL
    Value:
      !GetAtt ProductFunctionUrl.FunctionUrl

  ProductFunctionArn:
    Description: Product Lambda ARN
    Value:
      !GetAtt ProductLambda.Arn

  AuthorizerFunctionUrl:
    Description: Dedicated Authorizer Lambda Function URL
    Value:
      !GetAtt AuthorizerFunctionUrl.FunctionUrl

  AuthorizerFunctionArn:
    Description: Authorizer Lambda ARN
    Value:
      !GetAtt AuthorizerFunction.Arn

  LowStockTopicArn:
    Description: Low stock SNS topic ARN
    Value:
      !Ref LowStockTopic