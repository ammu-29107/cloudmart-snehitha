AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart product application stack.
  Creates Product Lambda, dedicated Authorizer Lambda,
  Schema Apply Lambda, Lambda Function URLs, IAM roles,
  and low-stock SNS notification resources.
  The Authorizer is owned by this stack; no separate auth-stack
  and no API Gateway are used.


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LambdaCodeKey:
    Type: String

  AuthorizerCodeKey:
    Type: String

  SchemaApplyCodeKey:
    Type: String

  AlertEmail:
    Type: String


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ==============================================================
  # AUTHORIZE LAMBDA ROLE
  # ==============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        # --------------------------------------------------------
        # SSM AUTH TOKEN
        # --------------------------------------------------------

        - PolicyName: AuthorizerSSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token


        # --------------------------------------------------------
        # CLOUDWATCH LOGGING
        # --------------------------------------------------------

        - PolicyName: AuthorizerLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


  # ==============================================================
  # AUTHORIZE LAMBDA
  # ==============================================================

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-authorizer

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !GetAtt AuthorizerLambdaRole.Arn

      Timeout: 10

      MemorySize: 128

      # ----------------------------------------------------------
      # PRIVATE SUBNET
      # ----------------------------------------------------------

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-a

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-sg-lambda

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref AuthorizerCodeKey

      Environment:
        Variables:

          AUTH_TOKEN_PARAM:
            !Sub /cloudmart/${Environment}/auth/token

          ENVIRONMENT:
            !Ref Environment


  # ==============================================================
  # AUTHORIZE LAMBDA FUNCTION URL
  # ==============================================================

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:

      TargetFunctionArn:
        !GetAtt AuthorizerFunction.Arn

      AuthType:
        NONE


  # ==============================================================
  # AUTHORIZE FUNCTION URL PERMISSION
  # ==============================================================

  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName:
        !Ref AuthorizerFunction

      Action:
        lambda:InvokeFunctionUrl

      Principal: '*'

      FunctionUrlAuthType:
        NONE


  # ==============================================================
  # AUTHORIZE FUNCTION URL INVOKE PERMISSION
  # ==============================================================

  AuthorizerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName:
        !Ref AuthorizerFunction

      Action:
        lambda:InvokeFunction

      Principal: '*'

      InvokedViaFunctionUrl:
        true


  # ==============================================================
  # PRODUCT LAMBDA ROLE
  # ==============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:


        # --------------------------------------------------------
        # SSM
        # --------------------------------------------------------

        - PolicyName: ProductSSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/inventory/low-stock-threshold


        # --------------------------------------------------------
        # CLOUDWATCH
        # --------------------------------------------------------

        - PolicyName: ProductLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


        # --------------------------------------------------------
        # EVENTBRIDGE
        # --------------------------------------------------------

        - PolicyName: ProductEventBridge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - events:PutEvents

                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-bus


        # --------------------------------------------------------
        # SNS
        # --------------------------------------------------------

        - PolicyName: ProductSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish

                Resource:
                  - !Ref LowStockTopic


  # ==============================================================
  # PRODUCT LAMBDA
  # ==============================================================

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product

      Runtime:
        python3.12

      Handler:
        handler.lambda_handler

      Role:
        !GetAtt ProductLambdaRole.Arn

      Timeout: 30

      MemorySize: 128

      # ----------------------------------------------------------
      # PRIVATE SUBNET
      # ----------------------------------------------------------

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-a

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-sg-lambda

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref LambdaCodeKey

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          # ------------------------------------------------------
          # DEDICATED AUTHORIZER FUNCTION URL
          # ------------------------------------------------------

          AUTHORIZER_URL:
            !GetAtt AuthorizerFunctionUrl.FunctionUrl

          # ------------------------------------------------------
          # DATABASE
          # ------------------------------------------------------

          DB_HOST_PARAM:
            !Sub /cloudmart/${Environment}/database/host

          DB_NAME_PARAM:
            !Sub /cloudmart/${Environment}/database/name

          DB_USER_PARAM:
            !Sub /cloudmart/${Environment}/database/username

          DB_PASSWORD_PARAM:
            !Sub /cloudmart/${Environment}/database/password

          # ------------------------------------------------------
          # INVENTORY
          # ------------------------------------------------------

          LOW_STOCK_THRESHOLD_PARAM:
            !Sub /cloudmart/${Environment}/inventory/low-stock-threshold

          # ------------------------------------------------------
          # EVENTBRIDGE
          # ------------------------------------------------------

          EVENT_BUS_NAME:
            !Sub cloudmart-${Environment}-bus

          # ------------------------------------------------------
          # SNS
          # ------------------------------------------------------

          LOW_STOCK_TOPIC_ARN:
            !Ref LowStockTopic


  # ==============================================================
  # PRODUCT FUNCTION URL
  # ==============================================================

  ProductFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:

      TargetFunctionArn:
        !GetAtt ProductLambda.Arn

      AuthType:
        NONE


  # ==============================================================
  # PRODUCT FUNCTION URL PERMISSION
  # ==============================================================

  ProductFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunctionUrl

      Principal: '*'

      FunctionUrlAuthType:
        NONE


  # ==============================================================
  # PRODUCT FUNCTION URL PERMISSION
  # ==============================================================

  ProductFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunction

      Principal: '*'

      InvokedViaFunctionUrl: true


  # ==============================================================
  # LOW STOCK SNS TOPIC
  # ==============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock


  # ==============================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ==============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==============================================================
  # SCHEMA APPLY ROLE
  # ==============================================================

  SchemaApplyRole:
    Type: AWS::IAM::Role
    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-schema-apply-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        # --------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # --------------------------------------------------------

        - PolicyName: SchemaApplySSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/*


        # --------------------------------------------------------
        # CLOUDWATCH
        # --------------------------------------------------------

        - PolicyName: SchemaApplyLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


  # ==============================================================
  # SCHEMA APPLY LAMBDA
  # ==============================================================

  SchemaApplyFunction:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-apply

      Runtime:
        python3.12

      Handler:
        handler.lambda_handler

      Role:
        !GetAtt SchemaApplyRole.Arn

      Timeout: 120

      MemorySize: 256

      # ----------------------------------------------------------
      # PRIVATE SUBNET
      # ----------------------------------------------------------

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-a

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-sg-lambda

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub cloudmart-${Environment}-lambda-artifacts-bucket

        S3Key:
          !Ref SchemaApplyCodeKey

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAM:
            !Sub /cloudmart/${Environment}/database/host

          DB_NAME_PARAM:
            !Sub /cloudmart/${Environment}/database/name

          DB_USER_PARAM:
            !Sub /cloudmart/${Environment}/database/username

          DB_PASSWORD_PARAM:
            !Sub /cloudmart/${Environment}/database/password


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ProductFunctionUrl:
    Description: Product Lambda Function URL
    Value:
      !GetAtt ProductFunctionUrl.FunctionUrl


  ProductFunctionArn:
    Description: Product Lambda ARN
    Value:
      !GetAtt ProductLambda.Arn


  AuthorizerFunctionUrl:
    Description: Dedicated Authorizer Lambda Function URL
    Value:
      !GetAtt AuthorizerFunctionUrl.FunctionUrl


  AuthorizerFunctionArn:
    Description: Authorizer Lambda ARN
    Value:
      !GetAtt AuthorizerFunction.Arn


  SchemaApplyFunctionArn:
    Description: Schema Apply Lambda ARN
    Value:
      !GetAtt SchemaApplyFunction.Arn


  LowStockTopicArn:
    Description: Low stock SNS topic ARN
    Value:
      !Ref LowStockTopic